<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1536" viewBox="0 0 1536 1536">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#2c3e50" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="vaultFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f6"/>
    </linearGradient>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f9e8f"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b5ce5"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1536" height="1536" fill="#f6f6f3"/>
  <g transform="translate(0,256)">

  <!-- ===== Escrow Account State box ===== -->
  <g filter="url(#shadow)">
    <rect x="478" y="28" width="580" height="392" rx="22" fill="#ffffff" stroke="#e6e6e1" stroke-width="1.5"/>
  </g>
  <text x="768" y="84" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#2c3e50">Escrow Account State</text>
  <line x1="510" y1="102" x2="1026" y2="102" stroke="#e6e6e1" stroke-width="2"/>

  <g font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#3a4658">
    <circle cx="536" cy="136" r="6" fill="#2a9d8f"/><text x="564" y="143">seed</text>
    <circle cx="536" cy="172" r="6" fill="#2a9d8f"/><text x="564" y="179">maker</text>
    <circle cx="536" cy="208" r="6" fill="#2a9d8f"/><text x="564" y="215">mint_a</text>
    <circle cx="536" cy="244" r="6" fill="#2a9d8f"/><text x="564" y="251">mint_b</text>
    <circle cx="536" cy="280" r="6" fill="#2a9d8f"/><text x="564" y="287">receive</text>
    <circle cx="536" cy="316" r="6" fill="#2a9d8f"/><text x="564" y="323">bump</text>
  </g>
  <!-- expiration bullet: clock icon + label + faint note -->
  <g transform="translate(536,360)">
    <circle r="10.5" fill="#eafaf6" stroke="#1f9e8f" stroke-width="2.4"/>
    <line x1="0" y1="0" x2="0" y2="-6" stroke="#1f9e8f" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="4.4" y2="3" stroke="#1f9e8f" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <text x="564" y="367" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f8a7a">expiration</text>
  <text x="700" y="367" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9aa3b5">(unix deadline)</text>

  <!-- up arrow Vault -> Escrow state -->
  <line x1="770" y1="466" x2="770" y2="430" stroke="#1f9e8f" stroke-width="4" marker-end="url(#arrowTeal)"/>

  <!-- ===== Maker box ===== -->
  <g filter="url(#shadow)">
    <rect x="60" y="470" width="280" height="176" rx="18" fill="#ffffff" stroke="#e6e6e1" stroke-width="1.5"/>
  </g>
  <text x="200" y="546" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#2c3e50">Maker</text>
  <line x1="82" y1="562" x2="318" y2="562" stroke="#e6e6e1" stroke-width="2"/>
  <text x="200" y="603" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#55607a">owns Token A</text>

  <!-- ===== Vault box ===== -->
  <g filter="url(#shadow)">
    <rect x="546" y="466" width="468" height="212" rx="18" fill="url(#vaultFill)" stroke="#e0e0da" stroke-width="1.5"/>
  </g>
  <text x="780" y="514" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#2c3e50">Vault (ATA)</text>
  <text x="780" y="544" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#55607a">holds Token A</text>
  <line x1="572" y1="560" x2="988" y2="560" stroke="#e0e0da" stroke-width="2"/>
  <text x="780" y="588" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#3a4658">Authority: Escrow PDA</text>
  <text x="780" y="616" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#9aa3b5">— PDA-controlled —</text>

  <!-- ===== Taker box ===== -->
  <g filter="url(#shadow)">
    <rect x="1196" y="470" width="280" height="176" rx="18" fill="#ffffff" stroke="#e6e6e1" stroke-width="1.5"/>
  </g>
  <text x="1336" y="546" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#2c3e50">Taker</text>
  <line x1="1218" y1="562" x2="1454" y2="562" stroke="#e6e6e1" stroke-width="2"/>
  <text x="1336" y="603" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#55607a">owns Token B</text>

  <!-- ===== make arrow: Maker -> Vault ===== -->
  <text x="443" y="500" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#1f9e8f">make</text>
  <text x="443" y="525" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-style="italic" fill="#5a8f87">(deposit Token A)</text>
  <line x1="346" y1="550" x2="540" y2="550" stroke="#1f9e8f" stroke-width="5" marker-end="url(#arrowTeal)"/>

  <!-- ===== refund arrow: Vault -> Maker (dashed, after deadline) ===== -->
  <line x1="546" y1="622" x2="346" y2="622" stroke="#1f9e8f" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrowTeal)"/>
  <text x="446" y="650" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f8a7a">refund</text>
  <text x="446" y="672" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#5a8f87">(return Token A)</text>
  <text x="446" y="692" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#7ba39c">(only after expiration)</text>

  <!-- ===== take arrow: Vault -> Taker ===== -->
  <text x="1121" y="500" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#7b5ce5">take</text>
  <text x="1121" y="525" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-style="italic" fill="#8d7ce0">(receive Token A)</text>
  <line x1="1020" y1="550" x2="1190" y2="550" stroke="#7b5ce5" stroke-width="5" marker-end="url(#arrowPurple)"/>
  <text x="1105" y="576" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#8d7ce0">(only before expiration)</text>

  <!-- ===== take arc: Taker -> Maker ===== -->
  <path d="M 1336 650 C 1336 905, 200 905, 200 650" fill="none" stroke="#7b5ce5" stroke-width="4.5" marker-end="url(#arrowPurple)"/>
  <text x="768" y="866" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#7b5ce5">take</text>
  <text x="768" y="893" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-style="italic" fill="#8d7ce0">(send Token B · before expiration)</text>

  <!-- footer -->
  <text x="640" y="996" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#a9aec0">———</text>
  <text x="768" y="996" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#55607a">Trustless exchange</text>
  <text x="896" y="996" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#a9aec0">———</text>
  </g>
</svg>
